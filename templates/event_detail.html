{% extends 'base.html' %}
{% load static %}

{% block title %}Event Details - College Event Management{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body" id="eventDetails">
                    <!-- Event details will be loaded here -->
                </div>
            </div>

            <!-- Feedback Section -->
            <div class="card shadow-sm mt-4" id="feedbackSection" style="display: none;">
                <div class="card-header">
                    <h5 class="mb-0">Event Feedback</h5>
                </div>
                <div class="card-body">
                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label for="rating" class="form-label">Rating</label>
                            <div class="rating-stars">
                                <i class="fas fa-star" data-rating="1"></i>
                                <i class="fas fa-star" data-rating="2"></i>
                                <i class="fas fa-star" data-rating="3"></i>
                                <i class="fas fa-star" data-rating="4"></i>
                                <i class="fas fa-star" data-rating="5"></i>
                            </div>
                            <input type="hidden" id="rating" name="rating" required>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Comment</label>
                            <textarea class="form-control" id="comment" rows="3" placeholder="Share your experience..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Feedback</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Quick Actions</h5>
                </div>
                <div class="card-body" id="actionButtons">
                    <!-- Action buttons will be loaded here -->
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-header">
                    <h5 class="mb-0">Event Information</h5>
                </div>
                <div class="card-body" id="eventInfo">
                    <!-- Event info will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/event-detail.js' %}"></script>
{% endblock %}
