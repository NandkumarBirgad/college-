<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even and Odd Checker</title>
    <style>
        body{
            background-color: rgb(146, 101, 189);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 50px;
        }
        h2{
            color: rgb(19, 18, 18);
        }
        input {
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            border-color: crimson;
        }
          button {
            padding: 10px 20px;
            background-color: #28a745;
            border-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            
        }
        button:hover {
            background-color: #218838;
           
           
           
        }
        p {
            font-size: 18px;
            color: #050505;
        }
    </style>
</head>
<body>
    <h2>Check Even and Odd Number</h2>
    <label>Enter a number: </label>
    <input type="number" id="num">
    <button onclick="checkEvenOdd()">Check</button>
    <p id="result"></p> <!-- This will display the result -->

   <script>
    function checkEvenOdd(){
        var n = document.getElementById("num").value;
        var resultText = document.getElementById("result");

        if (n === "") {
            resultText.innerText = "Please enter a number!";
            return;
        }

        if (n % 2 == 0) {
            resultText.innerText = n + " is even";
        } else {
            resultText.innerText = n + " is odd";
        }
    }
   </script> 
</body>
</html>
